name: LabManager CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: "sqlite://"
      JWT_SECRET_KEY: "ci-only-test-key-not-for-production-0123456789abcdef"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Run backend tests with coverage
        run: python -m pytest -q

      - name: Run Redis integration tests
        run: bash deploy/scripts/test-redis-integration.sh

      - name: Run PostgreSQL integration tests
        run: bash deploy/scripts/test-postgresql-integration.sh

  frontend:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests with coverage
        run: npm run test:coverage

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build
