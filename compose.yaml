services:
  api:
    build:
      context: .
      target: production
    container_name: labmanager-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://labmanager_user:${POSTGRES_PASSWORD}@postgres-db:5432/labmanager
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    networks:
      - postgres-db_default

  api-test:
    build:
      context: .
      target: test
    profiles:
      - test
    environment:
      DATABASE_URL: "sqlite://"
      JWT_SECRET_KEY: "local-test-key-not-for-production-0123456789abcdef"
    network_mode: none

networks:
  postgres-db_default:
    external: true
