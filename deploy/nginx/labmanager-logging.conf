# Structured access logging for LabManager.
# Raw URLs, query strings and sensitive headers are excluded.

# Normalize untrusted HTTP methods.
map $request_method $labmanager_log_method {
    default OTHER;
    ~^GET$ GET;
    ~^POST$ POST;
    ~^PUT$ PUT;
    ~^PATCH$ PATCH;
    ~^DELETE$ DELETE;
    ~^HEAD$ HEAD;
    ~^OPTIONS$ OPTIONS;
}

# Keep status codes valid JSON numbers.
map $status $labmanager_log_status {
    default 0;
    ~^[1-5][0-9][0-9]$ $status;
}

log_format labmanager_json escape=json
    '{'
        '"timestamp":"$time_iso8601",'
        '"logger":"nginx",'
        '"event":"request_completed",'
        '"request_id":"$request_id",'
        '"method":"$labmanager_log_method",'
        '"status_code":$labmanager_log_status,'
        '"duration_seconds":$request_time,'
        '"upstream_status":"$upstream_status",'
        '"upstream_duration_seconds":"$upstream_response_time",'
        '"response_bytes":$body_bytes_sent'
    '}';
