# Shared traffic protection for LabManager.

map $uri $labmanager_login_key {
    default "";
    /api/login $server_name;
}

map $uri $labmanager_register_key {
    default "";
    /api/register $server_name;
}

map $uri $labmanager_settings_key {
    default "";
    /api/users/me/email $server_name;
    /api/users/me/password $server_name;
}

limit_req_zone $labmanager_login_key
    zone=labmanager_login:1m rate=120r/m;

limit_req_zone $labmanager_register_key
    zone=labmanager_register:1m rate=60r/m;

limit_req_zone $labmanager_settings_key
    zone=labmanager_settings:1m rate=60r/m;

limit_req_zone $server_name
    zone=labmanager_api:1m rate=20r/s;
