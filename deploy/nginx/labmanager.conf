server {
    listen 127.0.0.1:80;
    server_name localhost 127.0.0.1;

    root /var/www/labmanager;
    index index.html;

    server_tokens off;

    add_header X-Request-ID $request_id always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    access_log /var/log/nginx/labmanager-access.log labmanager_json;
    error_log /var/log/nginx/labmanager-error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /api {
        return 404;
    }

    # Prevent external access to monitoring metrics
    location ~* ^/api/metrics(?:/|$) {
        return 404;
    }

    location /api/ {
        limit_req zone=labmanager_login burst=20 nodelay;
        limit_req zone=labmanager_register burst=10 nodelay;
        limit_req zone=labmanager_settings burst=10 nodelay;
        limit_req zone=labmanager_api burst=40 nodelay;

        limit_req_status 429;
        limit_req_log_level warn;

        error_page 429 = @rate_limit_exceeded;

        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location @rate_limit_exceeded {
        default_type application/json;
        return 429 '{"detail":"Too many requests. Please try again later."}';
    }
}
